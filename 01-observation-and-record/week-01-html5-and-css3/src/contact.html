<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Week 01</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Full Stack Web Development - Week 01</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Get In Touch</h2>
            <p style="margin-bottom: 16px;">Have questions regarding the lab sessions? Send a message below.</p>
            <form action="#" class="registration-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="contactEmail">Email:</label>
                    <input type="email" id="contactEmail" required placeholder="Your email">
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" rows="4" placeholder="Your query or message..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn primary">Send Message</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Full Stack Web Development Lab</p>
    </footer>
</body>
</html>
