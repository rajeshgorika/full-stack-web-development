<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1: HTML5 Forms & Flexbox Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Full Stack Web Development - Week 01</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Program 1: HTML5 Semantic Form -->
        <section class="card">
            <h2>Program 1: Student Registration Form</h2>
            <form action="#" method="POST" class="registration-form">
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="form-group">
                    <label for="course">Selected Course:</label>
                    <select id="course" name="course">
                        <option value="mern">MERN Stack Development</option>
                        <option value="mean">MEAN Stack Development</option>
                        <option value="python">Python Full Stack</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn primary">Submit Application</button>
                    <button type="reset" class="btn secondary">Reset</button>
                </div>
            </form>
        </section>

        <!-- Program 2: CSS3 Flexbox Layout Demonstration -->
        <section class="card">
            <h2>Program 2: Flexbox Card Grid</h2>
            <div class="flex-container">
                <div class="flex-item">
                    <h3>Frontend</h3>
                    <p>HTML5, CSS3, JavaScript, React.js</p>
                </div>
                <div class="flex-item">
                    <h3>Backend</h3>
                    <p>Node.js, Express.js, REST APIs</p>
                </div>
                <div class="flex-item">
                    <h3>Database</h3>
                    <p>MongoDB, Mongoose ORM, Aggregations</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Full Stack Web Development Lab</p>
    </footer>
</body>
</html>
