<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navbar</title>

    <style>
        nav {
            display: flex;
            justify-content: space-around;
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
