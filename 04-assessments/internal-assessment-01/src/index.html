<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Assessment 01 - Exam Submission</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="exam-container">
        <header>
            <h2>Internal Assessment 01</h2>
            <p>Subject: Full Stack Web Development | Lab Practical Exam</p>
        </header>

        <section class="question-box">
            <h3>Practical Problem: Dynamic Employee Directory</h3>
            <p>Implement a responsive directory allowing filtering by department and live search using JavaScript ES6.</p>
        </section>

        <section class="controls">
            <input type="text" id="searchInput" placeholder="Search by employee name...">
            <select id="deptFilter">
                <option value="all">All Departments</option>
                <option value="Engineering">Engineering</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
            </select>
        </section>

        <div id="employeeGrid" class="employee-grid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
