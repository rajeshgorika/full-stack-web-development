<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA-02 Full Stack Practical Application</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 24px; color: #1e293b; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.06); }
        h1 { color: #0f172a; font-size: 24px; margin-bottom: 8px; }
        .form-row { display: flex; gap: 10px; margin: 20px 0; }
        input, select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; }
        input { flex: 2; }
        button { background: #0284c7; color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #0369a1; }
        .ticket-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
        .ticket-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f1f5f9; border-radius: 6px; }
        .badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: 600; background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Internal Assessment 02: Full-Stack Ticket Manager</h1>
        <p style="color: #64748b;">Live integration between Express REST API and Client UI</p>

        <form id="ticketForm" class="form-row">
            <input type="text" id="titleInput" placeholder="New ticket title..." required>
            <select id="prioritySelect">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>
            <button type="submit">Create Ticket</button>
        </form>

        <ul id="ticketsList" class="ticket-list"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
