services:
  - type: web
    name: mini-project-api
    env: node
    rootDir: 05-individual-mini-project/src/server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
